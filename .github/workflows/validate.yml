name: Validate

on:
  pull_request:
    paths: ["terraform/**", "statemachine/**", ".github/workflows/validate.yml"]
  push:
    branches: [main]
    paths: ["terraform/**", "statemachine/**", ".github/workflows/validate.yml"]

jobs:
  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12.3119.0
        with:
          directory: terraform
          framework: terraform
          soft_fail: true

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt check
        run: terraform -chdir=terraform fmt -check -recursive
      - name: Terraform init (no backend, no credentials needed)
        run: terraform -chdir=terraform init -backend=false
      - name: Terraform validate
        run: terraform -chdir=terraform validate

  validate-state-machine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Amazon States Language JSON is well-formed
        run: |
          sed -E 's/\$\{[a-zA-Z0-9_]+\}/placeholder/g' statemachine/pipeline.asl.json | jq empty
          echo "pipeline.asl.json is valid JSON once template placeholders are substituted"
